# Seed jobs via the JCasC `jobs:` root (job-dsl plugin). Runs as SYSTEM at
# configuration-apply time — the standard way to seed generated jobs without
# per-job run-as configuration.
jobs:
  - script: >
      folder('generated') {
          description('Jobs generated by the platform seed DSL')
      }

      pipelineJob('generated/hello-generated') {
          definition {
              cps {
                  script('''
                      pipeline {
                          agent none
                          stages {
                              stage('Echo') {
                                  steps {
                                      echo 'generated job says hi'
                                  }
                              }
                          }
                      }
                  '''.stripIndent())
                  sandbox(true)
              }
          }
      }
