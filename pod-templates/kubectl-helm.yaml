# clouds.kubernetes.templates[]
# alpine/k8s bundles kubectl, helm, and kustomize. For in-cluster deploys,
# grant the pod's service account the target-namespace RBAC it needs; for
# other clusters, mount a kubeconfig from a Jenkins credential.
- name: kubectl-helm
  label: kubectl helm
  idleMinutes: 5
  podRetention: "never"
  containers:
    - name: k8s
      image: alpine/k8s:1.31.2
      command: sleep
      args: 99d
      ttyEnabled: true
      workingDir: /home/jenkins/agent
      resourceRequestCpu: "250m"
      resourceRequestMemory: "512Mi"
      resourceLimitCpu: "1"
      resourceLimitMemory: "1Gi"
