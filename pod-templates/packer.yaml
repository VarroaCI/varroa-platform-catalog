# clouds.kubernetes.templates[]
# Builds that talk to a cloud need the matching credentials injected by the
# pipeline (see aws-cli/gcloud/azure-cli notes); `packer validate` needs none.
- name: packer
  label: packer
  idleMinutes: 5
  podRetention: "never"
  containers:
    - name: packer
      image: hashicorp/packer:1.11
      command: sleep
      args: 99d
      ttyEnabled: true
      workingDir: /home/jenkins/agent
      resourceRequestCpu: "250m"
      resourceRequestMemory: "512Mi"
      resourceLimitCpu: "1"
      resourceLimitMemory: "1Gi"
