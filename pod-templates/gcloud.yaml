# clouds.kubernetes.templates[]
# Authenticate via GKE workload identity (serviceAccount on the pod) or a
# service-account key credential activated in the pipeline.
- name: gcloud
  label: gcloud
  idleMinutes: 5
  podRetention: "never"
  containers:
    - name: gcloud
      image: google/cloud-sdk:502.0.0-slim
      command: sleep
      args: 99d
      ttyEnabled: true
      workingDir: /home/jenkins/agent
      resourceRequestCpu: "250m"
      resourceRequestMemory: "512Mi"
      resourceLimitCpu: "1"
      resourceLimitMemory: "1Gi"
