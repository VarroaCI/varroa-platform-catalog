# clouds.kubernetes.templates[]
# OpenTofu is a drop-in swap: replace the image with
# ghcr.io/opentofu/opentofu:1.8 and alias `tofu` in your pipeline.
- name: terraform
  label: terraform
  idleMinutes: 5
  podRetention: "never"
  containers:
    - name: terraform
      image: hashicorp/terraform:1.9
      command: sleep
      args: 99d
      ttyEnabled: true
      workingDir: /home/jenkins/agent
      resourceRequestCpu: "250m"
      resourceRequestMemory: "512Mi"
      resourceLimitCpu: "1"
      resourceLimitMemory: "1Gi"
