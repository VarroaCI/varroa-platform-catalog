# clouds.kubernetes.templates[]
# Authenticate via `az login --service-principal` with a Jenkins credential,
# or AKS workload identity on the pod's service account.
- name: azure-cli
  label: azure
  idleMinutes: 5
  podRetention: "never"
  containers:
    - name: azure
      image: mcr.microsoft.com/azure-cli:2.67.0
      command: sleep
      args: 99d
      ttyEnabled: true
      workingDir: /home/jenkins/agent
      resourceRequestCpu: "250m"
      resourceRequestMemory: "512Mi"
      resourceLimitCpu: "1"
      resourceLimitMemory: "1Gi"
