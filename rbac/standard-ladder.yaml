# The classic enterprise access ladder: four global tiers bound to directory
# groups. Rename the group names under `subjects` to match your IdP, then:
#
#   kubectl apply -n varroa-system -f rbac/standard-ladder.yaml
#
# JenkinsRoleBinding is cluster-scoped and applies to every managed controller
# unless you add a controllerScope (see rbac/README.md).
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRole
metadata:
  name: platform-admin
spec:
  roleType: Global
  description: Full administrative control of the controller.
  permissions:
    - hudson.model.Hudson.Administer
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRole
metadata:
  name: release-manager
spec:
  roleType: Global
  description: Everything a developer can do, plus deleting/updating build records and tagging builds for release bookkeeping.
  permissions:
    - hudson.model.Hudson.Read
    - hudson.model.Item.Read
    - hudson.model.Item.Discover
    - hudson.model.Item.Build
    - hudson.model.Item.Cancel
    - hudson.model.Item.Workspace
    - hudson.model.Run.Update
    - hudson.model.Run.Delete
    - hudson.model.Run.Replay
    - hudson.model.View.Read
    - hudson.scm.SCM.Tag
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRole
metadata:
  name: developer
spec:
  roleType: Global
  description: Run, cancel, and replay builds; inspect workspaces. No configuration rights.
  permissions:
    - hudson.model.Hudson.Read
    - hudson.model.Item.Read
    - hudson.model.Item.Discover
    - hudson.model.Item.Build
    - hudson.model.Item.Cancel
    - hudson.model.Item.Workspace
    - hudson.model.Run.Replay
    - hudson.model.View.Read
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRole
metadata:
  name: viewer
spec:
  roleType: Global
  description: Read-only browsing of jobs and views.
  permissions:
    - hudson.model.Hudson.Read
    - hudson.model.Item.Read
    - hudson.model.Item.Discover
    - hudson.model.View.Read
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRoleBinding
metadata:
  name: platform-admins
spec:
  roleRef: platform-admin
  subjects:
    - kind: Group
      name: jenkins-admins
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRoleBinding
metadata:
  name: release-managers
spec:
  roleRef: release-manager
  subjects:
    - kind: Group
      name: release-managers
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRoleBinding
metadata:
  name: developers
spec:
  roleRef: developer
  subjects:
    - kind: Group
      name: developers
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRoleBinding
metadata:
  name: viewers
spec:
  roleRef: viewer
  subjects:
    - kind: Group
      name: viewers
