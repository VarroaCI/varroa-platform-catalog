# Compliance and security-oversight roles. Both are strictly read-only:
# auditors see jobs and history, security officers additionally see which
# credentials exist (metadata only — Credentials/View never reveals secret
# values).
#
#   kubectl apply -n varroa-system -f rbac/auditor-security.yaml
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRole
metadata:
  name: auditor
spec:
  roleType: Global
  description: Read-only access to jobs, views, and build history for compliance review.
  permissions:
    - hudson.model.Hudson.Read
    - hudson.model.Item.Read
    - hudson.model.Item.Discover
    - hudson.model.View.Read
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRole
metadata:
  name: security-officer
spec:
  roleType: Global
  description: Auditor access plus visibility into credential inventory and workspace contents.
  permissions:
    - hudson.model.Hudson.Read
    - hudson.model.Item.Read
    - hudson.model.Item.Discover
    - hudson.model.Item.Workspace
    - hudson.model.View.Read
    - com.cloudbees.plugins.credentials.CredentialsProvider.View
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRoleBinding
metadata:
  name: auditors
spec:
  roleRef: auditor
  subjects:
    - kind: Group
      name: auditors
---
apiVersion: varroa.dev/v1alpha1
kind: JenkinsRoleBinding
metadata:
  name: security-officers
spec:
  roleRef: security-officer
  subjects:
    - kind: Group
      name: security-officers
