items:
  - kind: multibranch
    name: ${repo_name}
    sourcesList:
      - branchSource:
          source:
            github:
              repoOwner: ${org}
              repository: ${repo_name}
              traits:
                - gitHubBranchDiscovery:
                    strategyId: 1
                - gitHubPullRequestDiscovery:
                    strategyId: 1
                - gitHubForkDiscovery:
                    strategyId: 1
    projectFactory:
      workflowBranchProjectFactory:
        scriptPath: Jenkinsfile
