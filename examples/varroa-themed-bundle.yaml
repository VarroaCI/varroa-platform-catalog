# =============================================================================
# Varroa Themed Jenkins ComposedBundle
#
# Assembles the Varroa branded theme — the simple-theme-plugin plus JCasC
# configuration that loads the Varroa CSS from the Varroa frontend.
#
# Usage:
#   1. Register the platform catalog with a CatalogSource:
#      kubectl apply -f https://raw.githubusercontent.com/varroaci/varroa-platform-catalog/master/catalog-source.yaml
#   2. Apply this ComposedBundle:
#      kubectl apply -f examples/varroa-themed-bundle.yaml
#   3. Reference in a Controller:
#      spec:
#        composedBundleRef:
#          name: varroa-themed-bundle
#
# The CatalogItem CRD names use the pattern:
#   <CatalogSource-name>-<slugified-catalog-item-path>
# =============================================================================
apiVersion: varroa.dev/v1alpha1
kind: ComposedBundle
metadata:
  name: varroa-themed-bundle
  namespace: varroa-system
spec:
  displayName: "Varroa Branded Theme"
  description: "Applies the Varroa visual identity to a Jenkins controller — warm honey/caramel palette, rounded surfaces, branded build status colors."
  jcascMergeStrategy: errorOnConflict
  inputs:
    - itemRef:
        name: platform-catalog-plugins-theme
    - itemRef:
        name: platform-catalog-jcasc-varroa-theme
