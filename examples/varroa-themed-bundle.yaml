# Assembles the Varroa branded theme: the simple-theme-plugin pin plus the
# JCasC fragment that loads the Varroa CSS from the frontend.
#
# 1. Register this catalog (see README.md), e.g. with a CatalogSource named
#    "platform-catalog".
# 2. kubectl apply -f examples/varroa-themed-bundle.yaml
# 3. Reference it from a Controller:
#      spec:
#        composedBundleRef:
#          name: varroa-themed-bundle
#
# CatalogItem CRD names follow <CatalogSource-name>-<slugified-path>, so
# adjust the itemRef names below if your CatalogSource is named differently.
apiVersion: varroa.dev/v1alpha1
kind: ComposedBundle
metadata:
  name: varroa-themed-bundle
  namespace: varroa-system
spec:
  displayName: "Varroa Branded Theme"
  description: "Applies the Varroa visual identity to a Jenkins controller."
  jcascMergeStrategy: errorOnConflict
  inputs:
    - itemRef:
        name: platform-catalog-plugins-theme
    - itemRef:
        name: platform-catalog-jcasc-varroa-theme
